server:
  port: 8083

spring:
  application:
    name: orchestrator-service
  datasource:
    url: jdbc:postgresql://10.10.10.12:5444/hpuat?currentSchema=saga
    username: dwh
    password: dwh
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: orchestrator-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            type:
              mapping: "com.cdac.hpuat.inventory.dto.event.StockReservedEvent:com.cdac.hpuat.orchestrator.dto.event.StockReservedEvent, com.cdac.hpuat.issuetopatient.dto.event.IssueCreatedEvent:com.cdac.hpuat.orchestrator.dto.event.IssueCreatedEvent"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
