server:
  port: 8082

spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://localhost:8888
  rest:
    connection-timeout: 5000
    read-timeout: 10000

feign:
  client:
    config:
      default:  # Applies to all Feign clients
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: basic
        errorDecoder: feign.error.DefaultErrorDecoder
      order-service:
        connectTimeout: 3000
        readTimeout: 8000

logging:
  level:
    org.springframework.boot.env: DEBUG    # Shows config loading
    org.springframework.core.env: DEBUG    # Shows property resolution
    com.hipradeep: TRACE                   # Your package for custom logging
    com.hipradeep.userservice.client: DEBUG
    org.springframework.web.client: DEBUG




