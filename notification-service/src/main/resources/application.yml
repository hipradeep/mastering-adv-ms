spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_database
    username: postgres
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    function:
      scan:
        enabled: false
    stream:
      function:
        definition: notificationEventConsumer
      bindings:
        notificationEventConsumer-in-0:
          destination: inventory-event
server:
  port: 8085